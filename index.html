<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manual de Metodologia CD Belas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: fixed black masthead, sticky index at left, one reading column; a dark stage overlays it for projection. */
:root{
  --black:#0E0E0E;
  --ink:#16160F;
  --paper:#F3F3F0;
  --panel:#FFFFFF;
  --gold:#A8841C;
  --gold-bright:#C9A227;
  --gold-wash:rgba(201,162,39,.16);
  --line:#DAD8D1;
  --muted:#6A685F;
  --display:"Archivo","Arial Narrow",Helvetica,sans-serif;
  --body:"Source Sans 3",-apple-system,Segoe UI,Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);color:var(--ink);
  font-family:var(--body);font-size:16.5px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
a{color:inherit}
:focus-visible{outline:3px solid var(--gold-bright);outline-offset:2px}

/* ---------- masthead ---------- */
.mast{position:sticky;top:0;z-index:40;background:var(--black);color:#fff;
  display:flex;align-items:center;gap:16px;padding:10px 20px;border-bottom:3px solid var(--gold)}
.mast .plaque{width:40px;height:40px;border-radius:7px;background:#fff;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;overflow:hidden}
.mast .plaque img{width:30px;height:39px;display:block}
.mast .who{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.mast .who b{font-family:var(--display);font-weight:800;font-size:14px;letter-spacing:.14em;color:var(--gold-bright)}
.mast .who span{font-size:12.5px;color:#C9C7BF;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mast .spacer{flex:1}
.modes{display:flex;gap:6px;background:#1E1E1C;border-radius:999px;padding:4px}
.modes button{font:600 13px/1 var(--body);color:#C9C7BF;background:none;border:0;
  padding:8px 14px;border-radius:999px;cursor:pointer}
.modes button[aria-pressed="true"]{background:var(--gold-bright);color:#141208}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);gap:34px;
  max-width:1180px;margin:0 auto;padding:28px 20px 90px}
nav.index{position:sticky;top:78px;align-self:start;max-height:calc(100vh - 100px);overflow:auto}
nav.index p{font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--muted);margin:18px 0 7px}
nav.index p:first-child{margin-top:0}
nav.index a{display:block;text-decoration:none;font-size:14px;padding:5px 10px;border-left:2px solid var(--line);
  color:var(--muted)}
nav.index a:hover{color:var(--ink);border-left-color:var(--gold)}
nav.index a.on{color:var(--ink);font-weight:600;border-left-color:var(--gold);background:var(--gold-wash)}

main{min-width:0}
section{margin:0 0 56px;scroll-margin-top:92px}
.eyebrow{font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--gold);margin-bottom:8px}
h2{font-size:30px;font-weight:800;line-height:1.1;margin-bottom:10px}
h3{font-size:19px;font-weight:700;margin:26px 0 8px}
h4{font-size:14.5px;font-weight:700;margin:18px 0 6px;letter-spacing:.02em}
.lede{font-size:18px;color:#3A382F;max-width:66ch;margin-bottom:18px}
p{max-width:68ch;margin:0 0 12px}
.hr{height:2px;background:var(--black);margin:0 0 22px;max-width:120px}

/* ---------- tables ---------- */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel);margin:14px 0}
table{border-collapse:collapse;width:100%;font-size:14.5px;font-variant-numeric:tabular-nums}
th{font-family:var(--display);font-weight:700;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;
  text-align:left;background:var(--black);color:#fff;padding:10px 12px;white-space:nowrap}
td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:top}
tbody tr:nth-child(even) td{background:#FAFAF8}
td.n{white-space:nowrap}

/* ---------- cards ---------- */
.cards{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(248px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.card .num{font-family:var(--display);font-weight:800;font-size:13px;color:var(--gold);letter-spacing:.08em}
.card h4{margin:4px 0 6px;font-size:16px}
.card p{font-size:14.5px;color:#45433A;margin:0}

/* ---------- etapas ---------- */
.etapas{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));margin:16px 0}
.etapa{background:var(--panel);border:1px solid var(--line);border-top:5px solid var(--black);
  border-radius:10px;padding:16px 18px}
.etapa.lead{border-top-color:var(--gold-bright)}
.etapa b{display:block;font-family:var(--display);font-weight:800;font-size:19px}
.etapa .sc{font-size:13px;color:var(--muted);margin:2px 0 8px}
.etapa .fm{display:inline-block;font-weight:700;font-size:13px;background:var(--gold-wash);
  border:1px solid rgba(168,132,28,.35);border-radius:999px;padding:3px 10px;margin-bottom:10px}
.etapa ul{margin:0;padding-left:17px;font-size:14px;color:#45433A}
.gate{background:var(--black);color:#fff;border-radius:10px;padding:13px 16px;margin:12px 0;
  display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
.gate b{font-family:var(--display);font-weight:800;color:var(--gold-bright);font-size:13px;letter-spacing:.1em;
  text-transform:uppercase;white-space:nowrap}
.gate span{font-size:15px}

/* ---------- stacked bars ---------- */
.dist{margin:16px 0}
.distrow{display:grid;grid-template-columns:62px minmax(0,1fr);gap:12px;align-items:center;margin-bottom:7px}
.distrow .lb{font-weight:700;font-size:13.5px}
.bar{display:flex;height:26px;border-radius:5px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;font-style:normal;font-size:11px;font-weight:700;color:#fff;
  display:flex;align-items:center;justify-content:center}
.s1{background:var(--gold-bright);color:#141208 !important}
.s2{background:#3C3A33}
.s3{background:#8C897D}
.s4{background:#CFCCC2;color:#3A382F !important}
.key{display:flex;flex-wrap:wrap;gap:16px;font-size:13.5px;color:var(--muted);margin-top:10px}
.key span{display:flex;align-items:center;gap:7px}
.key i{width:13px;height:13px;border-radius:3px;display:block}

/* ---------- escalão ---------- */
.esc{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:20px}
.esc > header{background:var(--black);color:#fff;padding:16px 20px;display:flex;gap:16px;
  align-items:center;flex-wrap:wrap}
.esc .tag{font-family:var(--display);font-weight:800;font-size:25px;color:var(--gold-bright);line-height:1}
.esc .nm{font-family:var(--display);font-weight:700;font-size:17px}
.esc .meta{font-size:13px;color:#BFBDB4}
.esc .pills{display:flex;gap:7px;flex-wrap:wrap;margin-left:auto}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:4px 11px;white-space:nowrap;
  background:rgba(201,162,39,.2);color:var(--gold-bright);border:1px solid rgba(201,162,39,.45)}
.pill.plain{background:#262522;color:#D8D6CD;border-color:#3A3833}
.esc .body{padding:18px 20px 20px}
.esc .foco{font-size:16.5px;font-weight:600;border-left:3px solid var(--gold);padding-left:13px;margin-bottom:16px}
.two{display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(270px,1fr))}
ul.tick{list-style:none;margin:0;padding:0;font-size:14.5px}
ul.tick li{position:relative;padding-left:19px;margin-bottom:6px}
ul.tick li::before{content:"";position:absolute;left:0;top:8px;width:7px;height:7px;border-radius:2px;background:var(--gold)}
.warn{background:#1C1B18;color:#E6E3D9;border-radius:9px;padding:12px 15px;font-size:14px;margin-top:16px}
.warn b{color:var(--gold-bright)}

/* ---------- matriz famílias ---------- */
.mx{overflow-x:auto;margin:16px 0}
.mx table{min-width:660px;border-collapse:separate;border-spacing:3px}
.mx th{background:none;color:var(--ink);text-align:center;padding:4px;font-size:11.5px}
.mx th.fam{text-align:left;width:250px}
.mx td{border:0;padding:0}
.mx td.fam{font-size:14px;padding:4px 8px 4px 0;border:0;background:none !important}
.cell{height:26px;border-radius:5px;border:1px solid var(--line)}
.cell.n2{background:var(--gold-bright);border-color:var(--gold)}
.cell.n1{background:var(--gold-wash);border-color:rgba(168,132,28,.4)}
.cell.n0{background:var(--panel)}

/* ---------- pitches ---------- */
.pitches{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin:16px 0}
.pitch{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center}
.pitch b{display:block;font-family:var(--display);font-weight:800;font-size:15px}
.pitch .sc{font-size:12.5px;color:var(--muted);margin-bottom:8px}
.pitch svg{width:100%;height:auto;display:block}
.pitch .st{font-weight:700;font-size:13.5px;margin-top:8px}
.pitch .nt{font-size:12.5px;color:var(--muted)}

.note{font-size:14px;color:var(--muted);max-width:68ch}
.foot{border-top:2px solid var(--black);margin-top:40px;padding-top:16px;font-size:13px;color:var(--muted)}

/* ---------- stage (apresentação) ---------- */
.stage{position:fixed;inset:0;z-index:90;background:var(--black);color:#F4F3EE;display:none;
  flex-direction:column}
body.present .stage{display:flex}
body.present{overflow:hidden}
.board{flex:1;display:flex;flex-direction:column;justify-content:center;
  padding:min(7vh,64px) min(7vw,76px);overflow:auto}
.board .eb{font-family:var(--display);font-weight:700;font-size:clamp(11px,1.3vw,14px);letter-spacing:.2em;
  text-transform:uppercase;color:var(--gold-bright);margin-bottom:14px}
.board h2{font-size:clamp(26px,4.4vw,58px);line-height:1.04;color:#fff;margin-bottom:18px;max-width:20ch}
.board .sub{font-size:clamp(15px,1.8vw,23px);color:#BFBDB3;max-width:46ch;margin-bottom:22px}
.board ul{list-style:none;margin:0;padding:0;columns:1;max-width:1000px}
.board ul.two-col{columns:2;column-gap:46px}
.board li{font-size:clamp(14px,1.55vw,20px);line-height:1.4;margin-bottom:13px;
  padding-left:22px;position:relative;break-inside:avoid;color:#E8E6DE}
.board li::before{content:"";position:absolute;left:0;top:.55em;width:9px;height:9px;background:var(--gold-bright);border-radius:2px}
.board li b{color:#fff}
.board .big{display:flex;gap:28px;flex-wrap:wrap;margin-top:6px}
.board .big div{flex:1 1 180px}
.board .big .v{font-family:var(--display);font-weight:800;font-size:clamp(30px,5vw,62px);color:var(--gold-bright);line-height:1}
.board .big .k{font-size:14px;color:#AFACA2;margin-top:4px}
.board .quote{font-family:var(--display);font-weight:700;font-size:clamp(20px,3vw,38px);
  line-height:1.2;color:#fff;border-left:5px solid var(--gold-bright);padding-left:22px;max-width:24ch}
.cover{align-items:flex-start}
.cover .plaquebig{width:92px;height:92px;border-radius:12px;background:#fff;display:flex;
  align-items:center;justify-content:center;margin-bottom:26px}
.cover .plaquebig img{width:66px;height:85px}
.stagebar{display:flex;align-items:center;gap:14px;padding:12px 22px;border-top:1px solid #272622}
.stagebar .ct{font-family:var(--display);font-weight:700;font-size:13px;color:var(--gold-bright);
  letter-spacing:.08em;font-variant-numeric:tabular-nums}
.stagebar .tt{font-size:13px;color:#86847C;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stagebar button{font:600 13px/1 var(--body);background:#1E1E1C;color:#D8D6CD;border:1px solid #302F2A;
  border-radius:7px;padding:9px 14px;cursor:pointer}
.stagebar button:hover{border-color:var(--gold)}
.prog{position:absolute;left:0;right:0;bottom:0;height:3px;background:#242320}
.prog i{display:block;height:100%;background:var(--gold-bright);transition:width .18s}

@media (max-width:900px){
  .shell{grid-template-columns:1fr;gap:0}
  nav.index{position:static;max-height:none;margin-bottom:26px;
    display:flex;flex-wrap:wrap;gap:6px}
  nav.index p{width:100%;margin:10px 0 2px}
  nav.index a{border-left:0;border:1px solid var(--line);border-radius:999px;padding:5px 12px}
  nav.index a.on{border-color:var(--gold)}
  .board ul.two-col{columns:1}
}
@media print{
  .mast,nav.index,.stage{display:none !important}
  .shell{display:block;max-width:none;padding:0}
  section{break-inside:avoid}
  body{background:#fff;font-size:11pt}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>

<script>
/* ============ DADOS ============ */
var PRINCIPIOS=[
 ["O jogo é o meio e o fim","No mínimo 65% do tempo útil em situação de jogo. O exercício analítico isolado nunca passa de 15% da sessão."],
 ["Máximo contacto com a bola","Uma bola por jogador até ao Sub-11, nunca menos de uma por dois nos Sub-12 e Sub-13. Filas únicas interditas."],
 ["Rotação posicional até ao Sub-11","Todos passam por todos os sectores. A especialização começa no Sub-12 e é reversível até ao Sub-15."],
 ["Densidade acima de tudo","Tempo útil mínimo de 80% e máximo de seis jogadores por estação. Contam as acções com bola, não as explicações ouvidas."],
 ["Intervenção por questionamento","Pergunta, tempo de decisão, correcção depois. A instrução contínua retira ao jogador a leitura autónoma do jogo."],
 ["Progressão por conteúdo","O escalão define o enquadramento competitivo; o conteúdo segue o nível real do grupo e do jogador."],
 ["Um único modelo de jogo","Largura, espaço entre linhas e reacção à perda em sete segundos, declinados do Futebol 5 ao Futebol 11."],
 ["O erro é instrumento","O erro de execução corrige-se; o erro de decisão explora-se. Nenhum escalão desta faixa é avaliado pelo resultado."]
];

var QUALIDADE=[
 ["Tempo útil de treino","≥ 80% da sessão","Cronometragem em observação"],
 ["Tempo em situação de jogo","≥ 65% do tempo útil","Ficha de sessão"],
 ["Rácio bola/jogador","1:1 Sub-7 a Sub-11 · ≥ 1:2 Sub-12/13","Inventário de material"],
 ["Jogadores por treinador","≤ 12 Sub-7/8 · ≤ 14 Sub-9 a Sub-13","Mapa de recursos humanos"],
 ["Tempo de jogo por convocado","≥ 50% Sub-7 a Sub-11 · ≥ 40% Sub-12/13","Registo de substituições"],
 ["Sessões registadas em plataforma","100%","EMJOGO"],
 ["Avaliações individuais","3 por época","Grelha de avaliação"],
 ["Sessões observadas por equipa","≥ 6 por época","Relatório de observação"]
];

var ETAPAS=[
 {n:"Iniciação",sc:"Sub-7 · Sub-8",fm:"Futebol 3 → Futebol 5",g:["Relação individual com a bola","Hábito e rotina de treino"]},
 {n:"Aquisição",sc:"Sub-9 · Sub-10 · Sub-11",fm:"Futebol 5 → Futebol 7",g:["Modelo de jogo do clube instalado","Princípios das quatro fases","Pico da aprendizagem motora"],lead:true},
 {n:"Consolidação",sc:"Sub-12 · Sub-13",fm:"Futebol 7 → 9, depois 11",g:["Especialização posicional","Gestão individual de carga","Entrega ao Futebol 11"]}
];
var PASSAGENS=[
 ["Passagem 1","Domina a bola e já joga com os colegas. Sem isto, o Sub-9 não aprende princípios de jogo: aprende a esconder-se deles."],
 ["Passagem 2","Cumpre a sua função nas quatro fases. Sem isto, a especialização posicional do Sub-12 não tem sobre o que assentar."]
];

    es.forEach(function(e){
      if(e.isIntersecting){
        links.forEach(function(a){a.classList.toggle("on",a.getAttribute("href")==="#"+e.target.id)});
      }
    });
  },{rootMargin:"-88px 0px -70% 0px"});
  secs.forEach(function(s){io.observe(s)});
}

var cur=0;
function paint(){
  var b=B[cur],h="";
  if(b.cover){
    h="<div class='plaquebig'><img alt='CD Belas' src='"+document.getElementById("logo").src+"'></div>"+
      "<div class='eb'>Clube Desportivo de Belas · Departamento de Formação</div>"+
      "<h2>"+esc(b.h)+"</h2><div class='sub'>"+esc(b.s)+"</div>";
  }else if(b.quote){
    h="<div class='quote'>"+esc(b.quote)+"</div>";
  }else{
    if(b.eb)h+="<div class='eb'>"+esc(b.eb)+"</div>";
    h+="<h2>"+esc(b.h)+"</h2>";
    if(b.s)h+="<div class='sub'>"+esc(b.s)+"</div>";
    if(b.big){h+="<div class='big'>";b.big.forEach(function(x){h+="<div><div class='v'>"+esc(x[0])+"</div><div class='k'>"+esc(x[1])+"</div></div>"});h+="</div>"}
    if(b.b)h+=b.b;
  }
  var bd=document.getElementById("board");
  bd.className="board"+(b.cover?" cover":"");
  bd.innerHTML=h;
  bd.scrollTop=0;
  document.getElementById("ct").textContent=(cur+1)+" / "+B.length;
  document.getElementById("tt").textContent=b.t;
  document.getElementById("prog").style.width=((cur+1)/B.length*100)+"%";
}
function go(d){cur=Math.min(B.length-1,Math.max(0,cur+d));paint()}
function present(on){
  document.body.classList.toggle("present",on);
  document.getElementById("mEstudo").setAttribute("aria-pressed",String(!on));
  document.getElementById("mApres").setAttribute("aria-pressed",String(on));
  if(on){paint();try{document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()}catch(e){}}
  else{try{document.fullscreenElement&&document.exitFullscreen()}catch(e){}}
}
document.getElementById("mApres").addEventListener("click",function(){present(true)});
document.getElementById("mEstudo").addEventListener("click",function(){present(false)});
document.getElementById("sair").addEventListener("click",function(){present(false)});
document.getElementById("next").addEventListener("click",function(){go(1)});
document.getElementById("prev").addEventListener("click",function(){go(-1)});
document.addEventListener("keydown",function(e){
  if(!document.body.classList.contains("present"))return;
  if(e.key==="ArrowRight"||e.key==="PageDown"||e.key===" "){e.preventDefault();go(1)}
  else if(e.key==="ArrowLeft"||e.key==="PageUp"){e.preventDefault();go(-1)}
  else if(e.key==="Escape"){present(false)}
});
</script>
